name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    # Exercise the real Qwen path regularly even when the main branch is quiet.
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      semantic_smoke:
        description: "Download/cache Qwen and run the native semantic smoke test on every supported platform"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # llama.cpp defaults to static libraries. Keep release artifacts independent
  # of runner-local shared libraries.
  LLAMA_BUILD_SHARED_LIBS: "0"

jobs:
  quality:
    name: Formatting, lint, tests, and docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: quality

      - name: Run the local CI entry point
        run: cargo xtask ci

  native-smoke:
    name: Native build and lexical CLI smoke (${{ matrix.name }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            # Build on the older supported runner so the distributed glibc
            # baseline is compatible with Ubuntu 22.04/Debian 12-era hosts.
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            executable_suffix: ""
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            executable_suffix: ""
          - name: macOS Apple Silicon
            os: macos-14
            target: aarch64-apple-darwin
            executable_suffix: ""
          - name: Windows x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            executable_suffix: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: native-${{ matrix.target }}

      - name: Check native build prerequisites
        shell: pwsh
        run: cmake --version

      - name: Run the common local CI entry point on the native runner
        shell: pwsh
        run: cargo xtask ci

      - name: Build the release binary
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --locked --release --package jgrep --target $env:TARGET

      - name: Smoke-test fixed, regex, and stdin behavior without a model
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          EXECUTABLE_SUFFIX: ${{ matrix.executable_suffix }}
        run: |
          $binary = "target/$env:TARGET/release/jgrep$env:EXECUTABLE_SUFFIX"
          if (-not (Test-Path -LiteralPath $binary)) { throw "missing binary: $binary" }
          & $binary --version

          $fixed = @("alpha", "network timeout") | & $binary -F "network timeout"
          if ((@($fixed) -join "`n") -ne "network timeout") {
            throw "fixed-string stdin smoke test failed"
          }

          $regex = @("INFO ready", "WARN retry") | & $binary -E "WARN"
          if ((@($regex) -join "`n") -ne "WARN retry") {
            throw "extended-regex stdin smoke test failed"
          }

          $ai = @("alpha", "agent needle") | & $binary --ai -F "agent needle"
          if ((@($ai) -join "`n") -ne "-:2") {
            throw "compact AI location smoke test failed"
          }

  semantic-model-smoke:
    name: Real Qwen semantic smoke (${{ matrix.name }})
    needs: native-smoke
    # Pull requests retain fast, network-free CI. A real model run occurs on
    # main pushes, the weekly schedule, and an explicit dispatch request.
    # Tagged releases run the same gate in release.yml before publication.
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.semantic_smoke)
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            executable_suffix: ""
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            executable_suffix: ""
          - name: macOS Apple Silicon
            os: macos-14
            target: aarch64-apple-darwin
            executable_suffix: ""
          - name: Windows x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            executable_suffix: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: semantic-${{ matrix.target }}

      - name: Restore the pinned Qwen model
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/jgrep-model
          key: qwen2.5-0.5b-instruct-q8_0-6dd44a1fb35d11b5d1b28902876ce3cc9e882d0e-ca59ca7f13d0e15a8cfa77bd17e65d24f6844b554a7b6c12e07a5f89ff76844e-${{ matrix.target }}

      - name: Build the semantic binary
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --locked --release --package jgrep --target $env:TARGET

      - name: Download, validate, and exercise positive and negative real-model fixtures
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          EXECUTABLE_SUFFIX: ${{ matrix.executable_suffix }}
          # The runtime treats this as the directory containing the GGUF file.
          # Keeping it in runner.temp makes the cached data job-local.
          JGREP_MODEL_DIR: ${{ runner.temp }}/jgrep-model
        run: |
          $binary = "target/$env:TARGET/release/jgrep$env:EXECUTABLE_SUFFIX"
          & $binary --download-model

          $fixture = Join-Path $env:RUNNER_TEMP "jgrep-semantic-smoke.txt"
          @(
            "The network connection failure interrupted the upload."
            "The garden needs watering this afternoon."
          ) | Set-Content -LiteralPath $fixture -Encoding utf8

          # This fixed Q8_0 fixture was measured locally at 0.584 for the
          # positive first line and 0.048 for the unrelated negative second
          # line. It verifies both selections at 0.5 without presenting the
          # score as calibrated.
          $result = @(& $binary --ai --offline --device cpu --threshold 0.5 "network connection failure" $fixture)
          $expected = "{0}:1" -f $fixture
          if ((@($result) -join "`n") -ne $expected) {
            throw "semantic AI smoke test did not select the positive fixture and reject the negative fixture"
          }
