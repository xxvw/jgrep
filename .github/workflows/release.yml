name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Keep llama.cpp linked into the executable instead of depending on a
  # runner-local shared library. Do not add target-cpu=native flags here.
  LLAMA_BUILD_SHARED_LIBS: "0"

jobs:
  verify-release-input:
    name: Verify tag and source tree
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-quality

      - name: Require an annotated version tag
        shell: bash
        run: |
          set -euo pipefail
          # checkout may resolve the tag to its commit and omit the tag ref,
          # even with full history. Fetch the tag object explicitly before
          # checking that this release is based on an annotated tag.
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = "tag"

      - name: Require the tag to match the package version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "localjev-grep") | .version')"
          test -n "$package_version"
          test "$tag_version" = "$package_version"

      - name: Re-run the complete local CI contract
        run: cargo xtask ci

  build-package:
    name: Build and package (${{ matrix.name }})
    needs: verify-release-input
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            # This fixes the archive's glibc baseline at Ubuntu 22.04.
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive_format: tar.gz
            executable_suffix: ""
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            archive_format: tar.gz
            executable_suffix: ""
          - name: macOS Apple Silicon
            os: macos-14
            target: aarch64-apple-darwin
            archive_format: tar.gz
            executable_suffix: ""
          - name: Windows x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            archive_format: zip
            executable_suffix: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build a native, locked release binary
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cmake --version
          cargo build --locked --release --package localjev-grep --target $env:TARGET

      - name: Install the pinned license inventory generator
        shell: pwsh
        run: |
          cargo install cargo-about --version 0.9.2 --locked --features cli

      - name: Generate the locked third-party license inventory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          cargo about generate `
            --config scripts/release/cargo-about.toml `
            --manifest-path Cargo.toml `
            --all-features `
            --locked `
            --fail `
            --output-file dist/THIRD_PARTY_LICENSES.html `
            scripts/release/third-party-licenses.hbs

      - name: Create the release archive and checksum
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE_FORMAT: ${{ matrix.archive_format }}
          EXECUTABLE_SUFFIX: ${{ matrix.executable_suffix }}
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          ./scripts/release/package.ps1 `
            -BinaryPath "target/$env:TARGET/release/jgrep$env:EXECUTABLE_SUFFIX" `
            -Version $version `
            -Target $env:TARGET `
            -Format $env:ARCHIVE_FORMAT `
            -OutputDirectory "dist" `
            -ThirdPartyLicensesPath "dist/THIRD_PARTY_LICENSES.html" `
            -Repository $env:GITHUB_REPOSITORY `
            -Ref $env:GITHUB_REF_NAME

      - name: Extract and run the packaged binary on its native runner
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE_FORMAT: ${{ matrix.archive_format }}
          EXECUTABLE_SUFFIX: ${{ matrix.executable_suffix }}
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $packageRoot = "localjev-grep-v$version-$env:TARGET"
          $archive = "dist/$packageRoot.$env:ARCHIVE_FORMAT"
          $checksum = "$archive.sha256"
          if (-not (Test-Path -LiteralPath $archive)) { throw "missing archive: $archive" }
          if (-not (Test-Path -LiteralPath $checksum)) { throw "missing checksum: $checksum" }

          $expected = (Get-Content -LiteralPath $checksum -Raw).Trim().Split(" ")[0]
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "archive checksum does not match $checksum" }

          $verifyDirectory = Join-Path $env:RUNNER_TEMP "jgrep-release-verify"
          New-Item -ItemType Directory -Force -Path $verifyDirectory | Out-Null
          if ($env:ARCHIVE_FORMAT -eq "zip") {
            Expand-Archive -LiteralPath $archive -DestinationPath $verifyDirectory -Force
          } else {
            & tar -xzf $archive -C $verifyDirectory
            if ($LASTEXITCODE -ne 0) { throw "could not extract $archive" }
          }

          $contents = Join-Path $verifyDirectory $packageRoot
          $required = @(
            "README.md",
            "LICENSE",
            "NOTICE",
            "LICENSES",
            "THIRD_PARTY_NOTICES.md",
            "THIRD_PARTY_LICENSES.html",
            "SOURCE.txt",
            "AGENTS.md",
            "scripts/install.sh",
            "scripts/install.ps1",
            "scripts/validate-installers.sh",
            "scripts/generate-localized-installers.py",
            ".agents/plugins/marketplace.json",
            "plugins/jgrep-agent/.codex-plugin/plugin.json",
            "plugins/jgrep-agent/skills/jgrep-agent/SKILL.md",
            "templates/AGENTS.jgrep.md"
          )
          $locales = @("en", "ja", "zh-CN", "ko", "es", "de", "ru", "fr", "pt-BR", "it", "ar", "hi")
          foreach ($locale in $locales) {
            $required += "installers/$locale/install.sh"
            $required += "installers/$locale/install.ps1"
            if ($locale -eq "en") {
              $required += "plugins/jgrep-agent/README.md"
            } else {
              $required += "plugins/jgrep-agent/README.$locale.md"
            }
          }
          $required | ForEach-Object {
            if (-not (Test-Path -LiteralPath (Join-Path $contents $_))) {
              throw "release archive is missing required content: $_"
            }
          }
          $binary = Join-Path $contents "jgrep$env:EXECUTABLE_SUFFIX"
          & $binary --version
          $match = @("alpha", "release needle") | & $binary -F "release needle"
          if ((@($match) -join "`n") -ne "release needle") {
            throw "packaged binary failed the stdin fixed-string smoke test"
          }

          $ai = @("alpha", "release needle") | & $binary --ai -F "release needle"
          if ((@($ai) -join "`n") -ne "-:2") {
            throw "packaged binary failed the compact AI location smoke test"
          }

          # Exercise the installer distributed inside this just-built archive
          # against the matching local asset directory. This is network-free
          # and verifies the archive naming, checksum, safe extraction, and
          # post-install executable on each native release runner.
          $installDirectory = Join-Path $env:RUNNER_TEMP "jgrep-release-installer-verify"
          if (Test-Path -LiteralPath $installDirectory) {
            Remove-Item -LiteralPath $installDirectory -Recurse -Force
          }
          $assetDirectory = (Resolve-Path -LiteralPath "dist").Path
          if ($env:ARCHIVE_FORMAT -eq "zip") {
            $installer = Join-Path $contents "installers/en/install.ps1"
            & pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $installer `
              -AssetDirectory $assetDirectory -Version "v$version" -Target $env:TARGET `
              -InstallDir $installDirectory
            if ($LASTEXITCODE -ne 0) { throw "packaged localized PowerShell installer failed" }
            $installed = Join-Path $installDirectory "jgrep.exe"
          } else {
            $installer = Join-Path $contents "installers/en/install.sh"
            & bash $installer --asset-dir $assetDirectory --version "v$version" `
              --target $env:TARGET --install-dir $installDirectory
            if ($LASTEXITCODE -ne 0) { throw "packaged localized Bash installer failed" }
            $installed = Join-Path $installDirectory "jgrep"
          }
          & $installed --version
          if ($LASTEXITCODE -ne 0) { throw "installer did not produce a runnable jgrep" }

      - name: Upload checked release asset
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  build-installer-bundles:
    name: Build standalone installer bundles
    needs: verify-release-input
    runs-on: ubuntu-24.04
    # This job packages only the checked installer sources and documentation.
    # It deliberately does not build jgrep or download the Qwen model.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Create versioned installer bundles and checksums
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          ./scripts/release/package-installers.ps1 `
            -Version $version `
            -OutputDirectory "dist" `
            -Repository $env:GITHUB_REPOSITORY `
            -Ref $env:GITHUB_REF_NAME

      - name: Verify installer-bundle checksums and contents
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $bundleRoot = "localjev-grep-installers-v$version"
          $archives = @(
            "dist/$bundleRoot.tar.gz",
            "dist/$bundleRoot.zip"
          )

          foreach ($archive in $archives) {
            $checksum = "$archive.sha256"
            if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
              throw "missing installer bundle: $archive"
            }
            if (-not (Test-Path -LiteralPath $checksum -PathType Leaf)) {
              throw "missing installer bundle checksum: $checksum"
            }

            $manifest = (Get-Content -LiteralPath $checksum -Raw).Trim() -split '\s+'
            if ($manifest.Count -lt 2 -or $manifest[1] -ne (Split-Path -Leaf $archive)) {
              throw "installer bundle checksum has an invalid manifest name: $checksum"
            }
            $expected = $manifest[0].ToLowerInvariant()
            $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) {
              throw "installer bundle checksum does not match: $checksum"
            }
          }

          # Check files and directories separately. `tar -t` records directory
          # entries with a trailing slash, while a generic existence check in the
          # extracted ZIP could otherwise let a directory satisfy a file requirement.
          $requiredFiles = @(
            "README.md",
            "LICENSE",
            "NOTICE",
            "THIRD_PARTY_NOTICES.md",
            "SOURCE.txt",
            "AGENTS.md",
            "CHANGELOG.md",
            "CONTRIBUTING.md",
            "SECURITY.md",
            "CODE_OF_CONDUCT.md",
            "RELEASING.md",
            "templates/AGENTS.jgrep.md",
            "eval/README.md",
            "scripts/install.sh",
            "scripts/install.ps1",
            ".agents/plugins/marketplace.json",
            "plugins/jgrep-agent/.codex-plugin/plugin.json",
            "plugins/jgrep-agent/skills/jgrep-agent/SKILL.md"
          )
          $requiredDirectories = @("LICENSES")
          $locales = @("en", "ja", "zh-CN", "ko", "es", "de", "ru", "fr", "pt-BR", "it", "ar", "hi")
          foreach ($locale in $locales) {
            $requiredFiles += "installers/$locale/install.sh"
            $requiredFiles += "installers/$locale/install.ps1"
            if ($locale -eq "en") {
              $requiredFiles += "plugins/jgrep-agent/README.md"
            } else {
              $requiredFiles += "plugins/jgrep-agent/README.$locale.md"
            }
          }

          $tarContents = @(& tar -tzf $archives[0])
          if ($LASTEXITCODE -ne 0) { throw "could not list $($archives[0])" }
          foreach ($path in $requiredFiles) {
            if ($tarContents -notcontains "$bundleRoot/$path") {
              throw "installer tarball is missing required file: $path"
            }
          }
          foreach ($path in $requiredDirectories) {
            if ($tarContents -notcontains "$bundleRoot/$path/") {
              throw "installer tarball is missing required directory: $path"
            }
          }

          $verifyDirectory = Join-Path $env:RUNNER_TEMP "jgrep-installer-bundle-verify"
          if (Test-Path -LiteralPath $verifyDirectory) {
            Remove-Item -LiteralPath $verifyDirectory -Recurse -Force
          }
          Expand-Archive -LiteralPath $archives[1] -DestinationPath $verifyDirectory -Force
          $contents = Join-Path $verifyDirectory $bundleRoot
          foreach ($path in $requiredFiles) {
            if (-not (Test-Path -LiteralPath (Join-Path $contents $path) -PathType Leaf)) {
              throw "installer zip is missing required file: $path"
            }
          }
          foreach ($path in $requiredDirectories) {
            if (-not (Test-Path -LiteralPath (Join-Path $contents $path) -PathType Container)) {
              throw "installer zip is missing required directory: $path"
            }
          }

          # The locale wrapper only delegates to the bundled core installer;
          # --help makes that linkage observable without a binary, network, or model.
          & bash (Join-Path $contents "installers/en/install.sh") --help
          if ($LASTEXITCODE -ne 0) { throw "bundled localized Bash installer failed" }

      - name: Upload checked installer bundles
        uses: actions/upload-artifact@v7
        with:
          name: release-installers
          path: |
            dist/localjev-grep-installers-*.tar.gz
            dist/localjev-grep-installers-*.zip
            dist/localjev-grep-installers-*.sha256
          if-no-files-found: error

  release-model-smoke:
    name: Real Qwen release gate (${{ matrix.name }})
    needs: verify-release-input
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            executable_suffix: ""
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            executable_suffix: ""
          - name: macOS Apple Silicon
            os: macos-14
            target: aarch64-apple-darwin
            executable_suffix: ""
          - name: Windows x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            executable_suffix: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-semantic-${{ matrix.target }}

      - name: Restore the pinned Qwen model
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/jgrep-model
          key: qwen2.5-0.5b-instruct-q8_0-6dd44a1fb35d11b5d1b28902876ce3cc9e882d0e-ca59ca7f13d0e15a8cfa77bd17e65d24f6844b554a7b6c12e07a5f89ff76844e-${{ matrix.target }}

      - name: Build the locked semantic binary
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --locked --release --package localjev-grep --target $env:TARGET

      - name: Download, validate, and score positive and negative real-model fixtures
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          EXECUTABLE_SUFFIX: ${{ matrix.executable_suffix }}
          JGREP_MODEL_DIR: ${{ runner.temp }}/jgrep-model
        run: |
          $binary = "target/$env:TARGET/release/jgrep$env:EXECUTABLE_SUFFIX"
          & $binary --download-model

          $fixture = Join-Path $env:RUNNER_TEMP "jgrep-release-semantic-smoke.txt"
          @(
            "The network connection failure interrupted the upload."
            "The garden needs watering this afternoon."
          ) | Set-Content -LiteralPath $fixture -Encoding utf8

          # This fixed Q8_0 fixture was measured locally at 0.584 for the
          # positive first line and 0.048 for the unrelated negative second
          # line. It verifies both selections at 0.5 without presenting the
          # score as calibrated.
          $result = @(& $binary --ai --offline --device cpu --threshold 0.5 "network connection failure" $fixture)
          $expected = "{0}:1" -f $fixture
          if ((@($result) -join "`n") -ne $expected) {
            throw "semantic AI release gate did not select the positive fixture and reject the negative fixture"
          }

  publish:
    name: Verify checksums and publish GitHub Release
    needs: [build-package, build-installer-bundles, release-model-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Normalize and verify SHA-256 manifests
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          shopt -s nullglob
          manifests=( *.sha256 )
          archives=( *.tar.gz *.zip )
          test "${#manifests[@]}" -eq 6
          test "${#archives[@]}" -eq 6

          version="${GITHUB_REF_NAME#v}"
          expected_archives=(
            "localjev-grep-v${version}-x86_64-unknown-linux-gnu.tar.gz"
            "localjev-grep-v${version}-x86_64-apple-darwin.tar.gz"
            "localjev-grep-v${version}-aarch64-apple-darwin.tar.gz"
            "localjev-grep-v${version}-x86_64-pc-windows-msvc.zip"
            "localjev-grep-installers-v${version}.tar.gz"
            "localjev-grep-installers-v${version}.zip"
          )
          for archive in "${expected_archives[@]}"; do
            test -f "$archive"
            test -f "$archive.sha256"
          done
          for manifest in "${manifests[@]}"; do
            sha256sum --check "$manifest"
          done
          cat "${manifests[@]}" | LC_ALL=C sort -k2,2 > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Publish immutable release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "A release already exists for $GITHUB_REF_NAME; refusing to overwrite it." >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --verify-tag \
            --title "localjev-grep $GITHUB_REF_NAME" \
            --generate-notes
