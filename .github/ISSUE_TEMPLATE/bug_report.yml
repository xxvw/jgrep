name: Bug report
description: Report a reproducible problem with jgrep or jgrep
title: "bug: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Do not include passwords, tokens,
        private logs, or vulnerability details. For security issues, follow
        SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: Version or revision
      description: Paste `jgrep --version` or the commit ID.
      placeholder: "jgrep <version>"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows x64
        - Linux x64
        - Other
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and minimal input
      description: Provide a redacted command and the smallest safe input that reproduces the issue.
      render: shell
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include output, exit code, and relevant stderr text.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include installation method, model configuration, or workaround if relevant.
