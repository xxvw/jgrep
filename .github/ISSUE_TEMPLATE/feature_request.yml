name: Feature request
description: Suggest an improvement to localjev-grep or jgrep
title: "feature: "
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem first. Please do not use public issues for
        security-sensitive reports; see SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Who encounters this problem, and what is difficult today?
      placeholder: "When I ..., I need ... because ..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Show example commands and expected output when helpful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include existing command-line tools or workflows that you tried.
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility considerations
      description: Note effects on grep-like usage, scripts, platforms, model downloads, or offline use.
