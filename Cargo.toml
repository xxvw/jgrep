[workspace]
members = ["xtask"]
resolver = "2"

[package]
name = "jgrep"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "A local semantic grep powered by Qwen2.5-0.5B-Instruct"
license = "GPL-3.0-or-later"
repository = "https://github.com/xxvw/jgrep"
homepage = "https://github.com/xxvw/jgrep"
keywords = ["grep", "semantic-search", "qwen", "cli"]
categories = ["command-line-utilities", "text-processing"]
readme = "README.md"
exclude = [".github", "tests/fixtures"]

[[bin]]
name = "jgrep"
path = "src/main.rs"

[features]
default = ["model-download", "model-runtime"]
model-download = ["dep:ureq"]
model-runtime = ["dep:llama-cpp-2"]

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.50", features = ["derive", "wrap_help"] }
directories = "6.0.0"
fs2 = "0.4.3"
globset = "0.4.16"
is-terminal = "0.4.16"
regex = "1.11.2"
sha2 = "0.10.9"
thiserror = "2.0.12"
ureq = { version = "3.0.11", default-features = true, optional = true }
walkdir = "2.5.0"
llama-cpp-2 = { version = "=0.1.156", default-features = false, optional = true }

[dev-dependencies]
assert_cmd = "2.0.16"
predicates = "3.1.3"
tempfile = "3.18.0"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
